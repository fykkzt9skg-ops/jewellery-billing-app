
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jewellery Billing App</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;margin:0;background:#f4f4f4;color:#222}
header{background:#292929;color:white;padding:18px;text-align:center}
main{max-width:850px;margin:auto;padding:16px}
.card{background:white;padding:16px;margin:14px 0;border-radius:12px;box-shadow:0 2px 8px #ddd}
h2{font-size:18px;margin-top:0}
input,select,button{font:inherit;padding:10px;border:1px solid #ccc;border-radius:7px}
input,select{width:100%;margin:5px 0 12px}
button{background:#292929;color:white;border:0;margin:4px 2px;cursor:pointer}
button.secondary{background:#666}
button.danger{background:#a33}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{border:1px solid #ddd;border-radius:8px;padding:12px;margin:10px 0}
.total{font-size:20px;font-weight:bold}
.bill{background:white;padding:20px;border:1px solid #ddd}
.bill h2{text-align:center}
table{width:100%;border-collapse:collapse;margin:12px 0}
th,td{border:1px solid #bbb;padding:7px;text-align:left;font-size:13px}
.right{text-align:right}
@media(max-width:500px){.grid{grid-template-columns:1fr}}
@media print{
 body{background:white}
 header,main>*:not(#invoice),#invoice button{display:none!important}
 #invoice{display:block!important;border:0;box-shadow:none;padding:0}
}
</style>
</head>
<body>
<header>
<h1>Jewellery Billing</h1>
<div>Gold & Silver Invoice</div>
</header>

<main>
<section class="card">
<h2>Shop Details</h2>
<input id="shop" placeholder="Shop name">
<input id="address" placeholder="Shop address">
<input id="phone" placeholder="Phone number">
<input id="gstin" placeholder="GSTIN (optional)">
</section>

<section class="card">
<h2>Customer Details</h2>
<input id="customer" placeholder="Customer name">
<input id="billdate" type="date">
</section>

<section class="card">
<h2>Items</h2>
<div id="items"></div>
<button onclick="addItem()">+ Add Item</button>
</section>

<section class="card">
<h2>Bill Summary</h2>
<div class="grid">
<label>Discount (₹)<input id="discount" type="number" value="0" oninput="calculate()"></label>
<label>GST % (optional)<input id="gst" type="number" placeholder="0" oninput="calculate()"></label>
</div>
<p>Subtotal: ₹<span id="subtotal">0.00</span></p>
<p>GST: ₹<span id="gstamount">0.00</span></p>
<p class="total">Grand Total: ₹<span id="grand">0.00</span></p>
<button onclick="makeInvoice()">Preview Invoice</button>
<button class="secondary" onclick="saveBill()">Save Bill</button>
<button class="secondary" onclick="showBills()">Search Saved Bills</button>
</section>

<section class="card" id="saved" style="display:none">
<h2>Saved Bills</h2>
<input id="search" placeholder="Search by customer or bill number" oninput="showBills()">
<div id="billlist"></div>
</section>

<section class="card" id="invoice" style="display:none">
<div class="bill" id="printarea"></div>
<button onclick="window.print()">Print / Save PDF</button>
</section>
</main>

<script>
let items=[];
let bills=JSON.parse(localStorage.getItem("jewelleryBills")||"[]");
let billNo=1;

document.getElementById("billdate").value=
new Date().toISOString().slice(0,10);

function addItem(){
 items.push({metal:"Gold",name:"",qty:1,weight:0,rate:0,wastage:0,making:0});
 renderItems();
}
function renderItems(){
 const box=document.getElementById("items");
 box.innerHTML="";
 items.forEach((it,i)=>{
  box.innerHTML+=`
  <div class="item">
  <b>Item ${i+1}</b>
  <button class="danger" onclick="removeItem(${i})">Remove</button>
  <label>Metal<select onchange="set(${i},'metal',this.value)">
  <option ${it.metal==="Gold"?"selected":""}>Gold</option>
  <option ${it.metal==="Silver"?"selected":""}>Silver</option>
  </select></label>
  <label>Item name<input value="${it.name}" placeholder="Ring, chain, etc." onchange="set(${i},'name',this.value)"></label>
  <div class="grid">
  <label>Quantity<input type="number" min="1" value="${it.qty}" onchange="set(${i},'qty',this.value)"></label>
  <label>Weight (g)<input type="number" min="0" step="0.001" value="${it.weight}" onchange="set(${i},'weight',this.value)"></label>
  <label>Rate per gram (₹)<input type="number" min="0" value="${it.rate}" onchange="set(${i},'rate',this.value)"></label>
  <label>Wastage %<input type="number" min="0" value="${it.wastage}" onchange="set(${i},'wastage',this.value)"></label>
  <label>Making charges (₹)<input type="number" min="0" value="${it.making}" onchange="set(${i},'making',this.value)"></label>
  </div>
  <p>Item total: ₹${itemTotal(it).toFixed(2)}</p>
  </div>`;
 });
 calculate();
}
function set(i,k,v){
 items[i][k]=k==="name"||k==="metal"?v:Number(v)||0;
 renderItems();
}
function removeItem(i){items.splice(i,1);renderItems()}
function itemTotal(it){
 const base=it.weight*it.rate*it.qty;
 return base+(base*it.wastage/100)+(Number(it.making)||0)*it.qty;
}
function calculate(){
 const sub=items.reduce((s,it)=>s+itemTotal(it),0);
 const discount=Math.max(0,Number(document.getElementById("discount").value)||0);
 const taxable=Math.max(0,sub-discount);
 const gstRate=Math.max(0,Number(document.getElementById("gst").value)||0);
 const tax=taxable*gstRate/100;
 document.getElementById("subtotal").textContent=sub.toFixed(2);
 document.getElementById("gstamount").textContent=tax.toFixed(2);
 document.getElementById("grand").textContent=(taxable+tax).toFixed(2);
 return {sub,discount,tax,taxable,grand:taxable+tax};
}
function makeInvoice(){
 const t=calculate();
 const date=document.getElementById("billdate").value;
 let rows=items.map(it=>`<tr>
 <td>${esc(it.name||it.metal)} (${esc(it.metal)})</td>
 <td>${it.qty}</td><td>${it.weight}</td><td>₹${it.rate}</td>
 <td>${it.wastage}%</td><td>₹${itemTotal(it).toFixed(2)}</td>
 </tr>`).join("");
 document.getElementById("printarea").innerHTML=`
 <h2>${esc(document.getElementById("shop").value||"Jewellery Shop")}</h2>
 <p class="right">Date: ${esc(date)}</p>
 <p>${esc(document.getElementById("address").value)}<br>
 Phone: ${esc(document.getElementById("phone").value)}<br>
 GSTIN: ${esc(document.getElementById("gstin").value)}</p>
 <hr><h3 style="text-align:center">JEWELLERY INVOICE</h3>
 <p>Customer: ${esc(document.getElementById("customer").value||"—")}</p>
 <table><tr><th>Item</th><th>Qty</th><th>Weight g</th><th>Rate</th><th>Wastage</th><th>Amount</th></tr>${rows}</table>
 <p class="right">Subtotal: ₹${t.sub.toFixed(2)}<br>
 Discount: ₹${t.discount.toFixed(2)}<br>
 GST: ₹${t.tax.toFixed(2)}</p>
 <h3 class="right">Grand Total: ₹${t.grand.toFixed(2)}</h3>
 <br><br><p class="right">Owner's Signature: ______________</p>`;
 document.getElementById("invoice").style.display="block";
}
function saveBill(){
 const t=calculate();
 const bill={id:Date.now(),no:billNo++,customer:document.getElementById("customer").value,
 date:document.getElementById("billdate").value,items:JSON.parse(JSON.stringify(items)),total:t.grand};
 bills.push(bill);
 localStorage.setItem("jewelleryBills",JSON.stringify(bills));
 alert("Bill saved on this device.");
}
function showBills(){
 document.getElementById("saved").style.display="block";
 const q=(document.getElementById("search").value||"").toLowerCase();
 document.getElementById("billlist").innerHTML=bills.filter(b=>
 (b.customer||"").toLowerCase().includes(q)||String(b.no).includes(q))
 .map(b=>`<div class="item">Bill ${b.no} — ${esc(b.customer||"Customer")} — ₹${b.total.toFixed(2)}
 <button onclick="loadBill(${b.id})">Open</button></div>`).join("")||"No saved bills found.";
}
function loadBill(id){
 const b=bills.find(x=>x.id===id);if(!b)return;
 items=JSON.parse(JSON.stringify(b.items));
 document.getElementById("customer").value=b.customer||"";
 document.getElementById("billdate").value=b.date||"";
 renderItems();makeInvoice();
}
function esc(s){
 return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
addItem();
</script>
</body>
</html>
